# Render Blueprint for muksmusic-server.
# In Render: New → Blueprint → connect the repo containing this file.
# Paths are relative to the REPO ROOT so Render always finds the Dockerfile.
# Render injects PORT; the server reads process.env.PORT and binds 0.0.0.0.
services:
  - type: web
    name: muksmusic-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # To survive YouTube bot-checks, add server/cookies.txt and uncomment:
    # envVars:
    #   - key: YTDLP_COOKIES
    #     value: /app/cookies.txt
